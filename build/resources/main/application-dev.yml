# Development Profile Configuration
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kitchensink}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:kitchensink}
    password: ${SPRING_DATASOURCE_PASSWORD:kitchensink}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    user:
      # Development credentials - externalize via environment variables for security
      # Set DEV_USERNAME and DEV_PASSWORD environment variables
      name: ${DEV_USERNAME:dev}
      password: ${DEV_PASSWORD:dev}

# CORS Configuration for Development
cors:
  allowed-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

logging:
  level:
    root: INFO
    org.jboss.as.quickstarts.kitchensink: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

