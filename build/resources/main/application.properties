# Spring Boot Application Configuration
# This replaces persistence.xml and provides centralized configuration

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# DATASOURCE CONFIGURATION
# ===============================
# H2 in-memory database for development (will be overridden by profiles)
spring.datasource.url=jdbc:h2:mem:kitchensink
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.probes.enabled=true
management.endpoint.health.probes.enabled=true

# Application info for actuator
info.app.name=Kitchensink Application
info.app.version=6.4.0-SNAPSHOT
info.app.description=Spring Boot migration of JBoss EAP Kitchensink

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Application security credentials (externalize via environment variables for production)
# Set APP_SECURITY_USER_USERNAME, APP_SECURITY_USER_PASSWORD, etc.
app.security.user.username=${APP_SECURITY_USER_USERNAME:user}
app.security.user.password=${APP_SECURITY_USER_PASSWORD:password}
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:admin}

# For production, configure SSL/TLS:
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-store-type=PKCS12

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.org.jboss.as.quickstarts.kitchensink=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG

