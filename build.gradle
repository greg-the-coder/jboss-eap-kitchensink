plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.jboss.quickstarts.eap'
version = '6.4.0-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // H2 Database for development/testing
    runtimeOnly 'com.h2database:h2'
    
    // MySQL Driver for production (optional)
    runtimeOnly 'com.mysql:mysql-connector-j'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ensure the build uses the correct source directory structure
sourceSets {
    main {
        java {
            srcDirs = ['kitchensink/src/main/java']
        }
        resources {
            srcDirs = ['kitchensink/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['kitchensink/src/test/java']
        }
        resources {
            srcDirs = ['kitchensink/src/test/resources']
        }
    }
}

// Configure the bootJar task
bootJar {
    archiveBaseName = 'jboss-kitchensink'
    archiveVersion = version
}
