# Spring Boot Application Configuration
# This replaces persistence.xml and provides centralized configuration

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATASOURCE CONFIGURATION
# ===============================
# H2 in-memory database for development (will be overridden by profiles)
spring.datasource.url=jdbc:h2:mem:kitchensink
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.org.jboss.as.quickstarts.kitchensink=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
