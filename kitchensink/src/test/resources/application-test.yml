# Test Profile Configuration for Spring Boot Tests
spring:
  datasource:
    url: jdbc:h2:mem:kitchensink-test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # Disable security for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging:
  level:
    root: WARN
    org.jboss.as.quickstarts.kitchensink: INFO
    org.springframework.test: INFO
