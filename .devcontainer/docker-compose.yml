version: '3.8'

services:
  # Development workspace container
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
      - gradle-cache:/workspace/.gradle
      - maven-cache:/root/.m2
      - npm-cache:/workspace/.npm
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kitchensink-network
    command: -c "sleep infinity"

  # MySQL database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kitchensink
      MYSQL_USER: kitchensink
      MYSQL_PASSWORD: kitchensink
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - kitchensink-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kitchensink-network:
    driver: bridge

volumes:
  mysql-data:
  gradle-cache:
  maven-cache:
  npm-cache:
