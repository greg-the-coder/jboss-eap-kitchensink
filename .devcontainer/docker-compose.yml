name: kitchensink-devcontainer

services:
  # Development workspace container
  workspace:
    container_name: kitchensink-workspace
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
      - gradle-cache:/workspace/.gradle
      - maven-cache:/root/.m2
      - npm-cache:/workspace/.npm
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - kitchensink-network
    environment:
      - FRONTEND_URL=http://frontend:3000
      - BACKEND_URL=http://backend:8080
      - DATABASE_URL=jdbc:mysql://mysql:3306/kitchensink
    entrypoint: ["/bin/sh"]
    command: ["-c", "sleep infinity"]

  # MySQL database
  mysql:
    container_name: kitchensink-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kitchensink
      MYSQL_USER: kitchensink
      MYSQL_PASSWORD: kitchensink
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - kitchensink-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    container_name: kitchensink-backend
    build:
      context: ../kitchensink
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitchensink
      SPRING_DATASOURCE_USERNAME: kitchensink
      SPRING_DATASOURCE_PASSWORD: kitchensink
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kitchensink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Next.js Frontend
  frontend:
    container_name: kitchensink-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kitchensink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  kitchensink-network:
    driver: bridge

volumes:
  mysql-data:
  gradle-cache:
  maven-cache:
  npm-cache:
