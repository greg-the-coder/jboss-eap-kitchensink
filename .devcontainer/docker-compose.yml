version: '3.8'

services:
  # Development workspace container
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
      # Mount Gradle cache for faster builds
      - gradle-cache:/workspace/.gradle
      # Mount Maven cache for faster builds
      - maven-cache:/root/.m2
      # Mount npm cache for faster installs
      - npm-cache:/workspace/.npm
    depends_on:
      mysql:
        condition: service_healthy
    # Port forwarding for accessing services from host
    ports:
      - "3306:3306"  # MySQL
      - "8080:8080"  # Backend Spring Boot (manual)
      - "3000:3000"  # Frontend Next.js (manual)
      - "5005:5005"  # Java debug port
    networks:
      - kitchensink-network
    command: -c "sleep infinity"

  # MySQL database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kitchensink
      MYSQL_USER: kitchensink
      MYSQL_PASSWORD: kitchensink
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - kitchensink-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kitchensink-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  gradle-cache:
    driver: local
  maven-cache:
    driver: local
  npm-cache:
    driver: local
