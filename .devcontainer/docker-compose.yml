version: '3.8'

services:
  # Development workspace container
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
      # Mount Gradle cache for faster builds
      - gradle-cache:/workspace/.gradle
      # Mount Maven cache for faster builds
      - maven-cache:/root/.m2
      # Mount npm cache for faster installs
      - npm-cache:/workspace/.npm
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      frontend:
        condition: service_started
    # Port forwarding for accessing services from host
    ports:
      - "3000:3000"  # Frontend Next.js
      - "8080:8080"  # Backend Spring Boot
      - "3306:3306"  # MySQL
      - "5432:5432"  # PostgreSQL
      - "5005:5005"  # Java debug port
    networks:
      - fullstack-network
    command: -c "sleep infinity"

  # Backend Spring Boot application
  backend:
    build:
      context: ../kitchensink
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kitchensink
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: kitchensink
      SPRING_DATASOURCE_PASSWORD: kitchensink
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fullstack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Frontend Next.js application
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fullstack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MySQL database for production profile testing
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kitchensink
      MYSQL_USER: kitchensink
      MYSQL_PASSWORD: kitchensink
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - fullstack-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database for alternative testing
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: kitchensink
      POSTGRES_USER: kitchensink
      POSTGRES_PASSWORD: kitchensink
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fullstack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchensink"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fullstack-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  postgres-data:
    driver: local
  gradle-cache:
    driver: local
  maven-cache:
    driver: local
  npm-cache:
    driver: local
